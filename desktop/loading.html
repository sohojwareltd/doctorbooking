<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doctor Booking</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Segoe UI, system-ui, sans-serif;
      background: linear-gradient(135deg, #2D3A74 0%, #1a2248 100%);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box { text-align: center; padding: 40px; max-width: 420px; }
    .logo { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .sub { opacity: 0.85; margin-bottom: 28px; font-size: 14px; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { font-size: 14px; opacity: 0.9; min-height: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Doctor Booking</div>
    <div class="sub">Offline mode · SQLite</div>
    <div class="spinner"></div>
    <div id="status">Starting...</div>
  </div>
</body>
</html>
